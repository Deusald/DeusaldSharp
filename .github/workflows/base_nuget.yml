name: "Deploy DeusaldSharp packages to NuGet"

on:
  push:
    tags:
      - 'v*'

env:
  # Packs every packable project: DeusaldSharp (meta), DeusaldSharp.Core, .Proto (with the bundled generator), ...
  PROJECT_PATH: 'DeusaldSharp.sln'
  PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}\output
  NUGET_SOURCE_URL: 'https://api.nuget.org/v3/index.json'

jobs:
  deploy:
    name: 'Deploy'
    runs-on: windows-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v2
          
      - name: 'Install dotnet 10.0'
        uses: actions/setup-dotnet@v1
        with: 
          dotnet-version: '10.0.x'
          
      - name: 'Restore packages'
        run: dotnet restore ${{ env.PROJECT_PATH }}
        
      - name: 'Build solution'
        run: dotnet build ${{ env.PROJECT_PATH }} --no-restore --configuration Release
      
      - name: 'Pack packages'
        run: dotnet pack ${{ env.PROJECT_PATH }} --no-restore --no-build --configuration Release --include-symbols --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }}
        
      - name: 'Push packages'
        run: dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}\*.nupkg -k ${{ secrets.NUGET_AUTH_TOKEN }} -s ${{ env.NUGET_SOURCE_URL }} --skip-duplicate